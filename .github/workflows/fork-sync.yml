name: Fork sync

# Keeps the default branch (jaya) on upstream's newest release, in two phases.
# "Sync and test" runs fork/sync.sh --test: it rebases the fork patches onto
# the newest upstream vX.Y.Z, runs upstream's tests and tags the result, with
# no credential anywhere in the job. "Publish" then loads a deploy key and runs
# fork/sync.sh --publish, which pushes the branch, the tag (that tag push runs
# release.yml) and new conflict resolutions. See fork/PATCHES.md.
#
# Needs the repository secret SYNC_DEPLOY_KEY: the private half of a deploy key
# with write access to this repo. A tag pushed with the built-in GITHUB_TOKEN
# would not start release.yml. The key lives only in the Publish step, after
# the last line of upstream code (pub get, the tests) has run.

on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:

# The built-in token only reads, and files the conflict issue; every push goes
# through the deploy key.
permissions:
  contents: read
  issues: write

# Two syncs must never overlap; a queued run waits instead of cancelling one
# that is mid-push.
concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: jaya
          fetch-depth: 0
          # The repo is public: no later step needs a token, and the next ones
          # run upstream code.
          persist-credentials: false

      - name: Git identity and upstream remote
        run: |
          git config user.name "herdr j sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/tuan3w/herdr-mobile

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          # Caches the SDK and the pub cache (keyed on pubspec.lock).
          cache: true

      # No credential exists here: this step runs upstream code. Exit 0 (synced
      # or up to date) goes on to Publish; 2 (a conflict rerere could not
      # resolve) fails the job after the next step files the issue; anything
      # else just fails it.
      - name: Sync and test
        id: sync
        run: |
          set +e
          fork/sync.sh --fork origin --test 2>&1 | tee "$RUNNER_TEMP/sync.log"
          code=${PIPESTATUS[0]}
          if [ "$code" = 2 ]; then
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$code"

      - name: Report the conflict
        if: failure() && steps.sync.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          log="$RUNNER_TEMP/sync.log"
          tag=$(sed -n 's/^conflict rebasing .* onto \(v[0-9.]*\);.*/\1/p' "$log")
          files=$(sed -n '/Conflicted files:$/,$p' "$log" | sed 1d)
          {
            echo "Upstream tag: \`$tag\`"
            echo
            echo "Conflicted files:"
            echo '```'
            echo "$files"
            echo '```'
            echo
            echo "The \`jaya\` branch is untouched. Resolve it once on a scratch branch and run \`fork/sync.sh --push\` from that clone, which publishes the resolution for this workflow (see fork/PATCHES.md, \"Syncing and releases\"). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/issue.md"
          title="Upstream sync conflict"
          n=$(gh issue list --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$title\") | .number" | sed -n 1p)
          if [ -z "$n" ]; then
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue.md"
          elif gh issue view "$n" --json body,comments --jq '[.body, (.comments[].body)] | join("\n")' | grep -qF "Upstream tag: \`$tag\`"; then
            echo "issue #$n already reports $tag"
          else
            gh issue comment "$n" --body-file "$RUNNER_TEMP/issue.md"
          fi

      # The only step that holds the key. It trusts GitHub's published SSH host
      # keys and nothing learned on first use, and kills the agent on exit.
      - name: Publish
        env:
          SYNC_DEPLOY_KEY: ${{ secrets.SYNC_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
          # Also overrides any core.sshCommand left in .git/config.
          GIT_SSH_COMMAND: ssh -o StrictHostKeyChecking=yes
        run: |
          install -d -m 700 ~/.ssh
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > ~/.ssh/known_hosts
          [ -s ~/.ssh/known_hosts ]
          eval "$(ssh-agent -s)" >/dev/null
          trap 'ssh-agent -k >/dev/null' EXIT
          ssh-add -q - <<<"$SYNC_DEPLOY_KEY"
          git remote set-url --push origin "git@github.com:$GITHUB_REPOSITORY.git"
          fork/sync.sh --fork origin --publish
